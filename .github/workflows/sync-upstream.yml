name: sync-upstream

# `main` is this fork's permanent product branch and is expected to diverge from
# spartan-ng/spartan forever (it carries our own components/changes) - it is
# intentionally NOT synced here. Instead, `upstream-main` is a read-only mirror
# of spartan-ng/spartan's `main`, always hard-reset to match it exactly. To pull
# upstream fixes into product code, diff/merge from `upstream-main` locally
# (see `git upstream-diff` / `git sync-upstream-branch` aliases in AGENTS.md).
#
# The second job is a visible tripwire: it fails loudly (not a buried
# ::warning::) if `main` ever stops containing all of upstream/main's history,
# which is this repo's #1 historical failure mode (feature branches merged
# into main silently drifting it away from upstream, see PR #1704 postmortem).

on:
  schedule:
    - cron: '0 13 * * *' # daily at 13:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  mirror-upstream-main:
    if: github.repository != 'spartan-ng/spartan'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: upstream-main
          fetch-depth: 0

      - name: Fetch upstream
        run: git remote add upstream https://github.com/spartan-ng/spartan.git && git fetch upstream main

      - name: Hard-reset upstream-main to upstream/main
        run: |
          git reset --hard upstream/main
          git push --force-with-lease origin upstream-main
          echo "upstream-main mirrored to upstream/main ($(git rev-parse --short upstream/main))."

  check-product-main-drift:
    if: github.repository != 'spartan-ng/spartan'
    needs: mirror-upstream-main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch upstream
        run: git remote add upstream https://github.com/spartan-ng/spartan.git && git fetch upstream main

      - name: Fail loudly if main is missing upstream commits
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "OK: main contains all of upstream/main's history ($(git rev-parse --short upstream/main))."
          else
            missing=$(git rev-list --count HEAD..upstream/main)
            echo "::error::main is missing $missing commit(s) from upstream/main. Merge/cherry-pick the needed fixes from the 'upstream-main' branch into main - see AGENTS.md."
            exit 1
          fi
